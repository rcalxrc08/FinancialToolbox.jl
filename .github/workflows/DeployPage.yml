name: Build and Deploy
# Builds the documentation (Documenter) and publishes it with GitHub Pages, whose source is "GitHub Actions": the build
# is uploaded as the Pages artifact and deployed by actions/deploy-pages, with no gh-pages branch.
on:
  push:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
  pages: write    # the deployment
  id-token: write # the token of the deployment
# one deployment at a time; a newer push does not cancel a deployment in progress
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install Julia
      uses: julia-actions/setup-julia@v3
      with:
        version: '1'
    - uses: julia-actions/cache@v3
    - run: julia --project=docs -e 'import Pkg; Pkg.instantiate()'
    - run: julia --project=docs --color=yes docs/make.jl
    - uses: actions/configure-pages@v6
    - uses: actions/upload-pages-artifact@v5
      with:
        path: docs/build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy 🚀
      id: deployment
      uses: actions/deploy-pages@v5
