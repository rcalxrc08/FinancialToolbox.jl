name: Build and Deploy
on:
  push:
    branches:
      - master
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install Julia
      uses: julia-actions/setup-julia@v3
      with:
        version: '1'
    # Julia >= 1.12: Franklin creates the module Utils_1 from page/utils.jl during the build and looks up its names
    # (e.g. the PkgPage environment `section`) from the older world age of the build call, where the module does not
    # exist yet. Defining Utils_1 beforehand makes those lookups succeed; Franklin's evaluations use the latest world.
    - run: julia --project=@. -e '
            import Pkg; Pkg.activate("page/Project.toml"); Pkg.develop(path = "."); Pkg.instantiate();
            using InteractiveUtils; versioninfo(); Pkg.build(); using FinancialToolbox;
            Pkg.add(["NodeJS", "PkgPage"]);
            using NodeJS;
            run(`$(npm_cmd()) install highlight.js purgecss`);
            import PkgPage, Franklin;
            Core.eval(Main, :(module Utils_1; import Franklin; include($(abspath("page/utils.jl"))); end));
            PkgPage.optimize(input="page", output="")'
    - run: touch page/__site/.nojekyll
    - name: Deploy 🚀
      uses: JamesIves/github-pages-deploy-action@releases/v4
      with:
        BRANCH: gh-pages
        FOLDER: page/__site
